server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agnes 生成结果不带 CORS 头，经同源路径反代给前端拉取落库。
    location /agnes-outputs/ {
        proxy_pass https://platform-outputs.agnes-ai.space/;
        proxy_ssl_server_name on;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
